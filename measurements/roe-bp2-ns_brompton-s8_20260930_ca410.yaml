# Two instruments, one artifact (§spec:sessions).
# The correction is derived in-session from paired readings of
# the full-drive R/G/B anchors and applied in software, so it is
# auditable here rather than buried in the colorimeter.
instrument_routing:
  method: "four-color-matrix"
  spectroradiometer:
    manufacturer: "Colorimetry Research"
    model: "CR-300"
    serial_number: "A00322"
    firmware: "1.44.0-S28"
  colorimeter:
    manufacturer: "Konica-Minolta"
    model: "CA-410 CA-VP427A"
    serial_number: "80005086"
    firmware: "Ver.1.80.0002"
  # XYZ_corrected = correction_matrix @ XYZ_colorimeter.
  correction_matrix:
    - [1.040450356, 0.001442855, -0.002060895]
    - [-0.006676713, 1.020337869, 0.000326102]
    - [-0.002132722, 0.006490026, 1.004248133]
  # Patches measuring at or above this corrected luminance
  # (cd/m²) route to the spectroradiometer, the rest to the
  # disciplined colorimeter.
  luminance_threshold: 10.000000000
  # The instrument behind each row, in presentation order.
  sources: ["spectroradiometer", "spectroradiometer", "spectroradiometer", "colorimeter", "spectroradiometer", "colorimeter", "colorimeter", "colorimeter", "spectroradiometer", "colorimeter", "spectroradiometer", "colorimeter", "colorimeter", "colorimeter", "colorimeter", "colorimeter", "spectroradiometer", "spectroradiometer", "colorimeter", "colorimeter", "colorimeter", "colorimeter", "spectroradiometer", "spectroradiometer", "colorimeter", "colorimeter", "colorimeter", "colorimeter", "colorimeter", "colorimeter", "colorimeter", "colorimeter", "colorimeter", "spectroradiometer", "colorimeter", "spectroradiometer", "spectroradiometer", "spectroradiometer", "colorimeter", "spectroradiometer", "colorimeter", "colorimeter", "spectroradiometer", "spectroradiometer", "colorimeter", "colorimeter", "colorimeter", "spectroradiometer", "colorimeter", "spectroradiometer", "colorimeter", "spectroradiometer", "colorimeter", "spectroradiometer", "colorimeter", "spectroradiometer", "colorimeter", "spectroradiometer", "colorimeter", "spectroradiometer", "spectroradiometer", "colorimeter", "spectroradiometer", "colorimeter", "colorimeter", "colorimeter", "spectroradiometer", "colorimeter", "colorimeter", "colorimeter", "spectroradiometer", "colorimeter"]

