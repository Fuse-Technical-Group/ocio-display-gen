  spectroradiometer:
    manufacturer: "Colorimetry Research"
    model: "CR-300"
    serial_number: "A00322"
    firmware: "1.44.0-S28"
  colorimeter:
    manufacturer: "Colorimetry Research"
    model: "CR-120"
    serial_number: "A00140"
    firmware: "1.39.0-A28"
