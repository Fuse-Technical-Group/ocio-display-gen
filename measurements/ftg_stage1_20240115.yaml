# HAND-BUILT SAMPLE. This file stands in for the output of a future
# `stilb characterize` session (§spec:measurement-loop). Real
# measurements artifacts are machine-written, immutable, and never
# hand-edited; the human act of record is promoting one into
# decisions.yaml as {file, sha256} (§spec:characterization-model).

measurement_date: "2024-01-15"

instrument:
  model: "X-Rite i1 Pro 2"
  firmware: "unknown"

# CIE xy chromaticities measured through the full chain
# (processor + panels), end-to-end black box.
colorimetry:
  primaries:
    red: [0.680, 0.320]
    green: [0.265, 0.690]
    blue: [0.150, 0.060]
  white_point: [0.3127, 0.3290]

# Absolute luminance, cd/m².
luminance:
  black_level: 0.005
  peak_luminance: 1000.0

# Ambient floor at measurement time, cd/m² (wall showing black;
# reflected ambient plus panel leakage).
ambient_floor: 5.0

# Processor state read at measurement time (read-only snapshot).
processor_state:
  eotf:
    type: "GAMMA"
    gamma_value: 2.4
  intensity: "100%"
  processing_disabled: true

# per_channel_response: omitted — not measured in this session
# (§road:measured-eotf-lut). Loaders tolerate its absence.
