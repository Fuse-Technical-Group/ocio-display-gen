# Two instruments, one artifact (§spec:sessions).
# The correction is derived in-session from paired readings of
# the full-drive R/G/B anchors and applied in software, so it is
# auditable here rather than buried in the colorimeter.
instrument_routing:
  method: "four-color-matrix"
  spectroradiometer:
    manufacturer: "Colorimetry Research"
    model: "CR-300"
    serial_number: "A00322"
    firmware: "1.44.0-S28"
  colorimeter:
    manufacturer: "Colorimetry Research"
    model: "CR-120"
    serial_number: "A00140"
    firmware: "1.39.0-A28"
  # XYZ_corrected = correction_matrix @ XYZ_colorimeter.
  correction_matrix:
    - [1.084512411, -0.040703638, -0.005484948]
    - [-0.028418229, 1.055855930, -0.006480466]
    - [-0.000954238, 0.000474616, 1.102140380]
