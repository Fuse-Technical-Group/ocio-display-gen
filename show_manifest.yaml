# SHOW MANIFEST — human-authored and reviewed (§spec:characterization-model).
# Holds only human decisions: show naming, the intended signal contract,
# OCIO targeting, and the promotion pointer to the measurements artifact
# of record. Measured values live in that artifact and are never edited
# by hand.

# VALIDATION MODE
# strict_mode true: validation failures stop the process.
# strict_mode false: validation failures warn but continue.
validation:
  strict_mode: true

# SHOW NAMING
# Panel + processor identity as configured for show; composes the
# registered display name:
#   "ROE Black Pearl 2 (NS) (2018) + Brompton S8 (3.5.2)"
show:
  description: "FTG Stage 1"
  led_panel:
    manufacturer: "ROE"
    model: "Black Pearl 2 (NS)"
    version: "2018"              # Year, batch, or explicit version number
  led_processor:
    manufacturer: "Brompton"
    model: "S8"
    version: "3.5.2"             # Firmware or software version

# INTENDED SIGNAL CONTRACT (§spec:signal-contract)
# The processor lockdown state the generated config is valid for;
# recorded in the config metadata for restore and audit.
signal_contract:
  eotf:
    type: "GAMMA"      # "PQ", "HLG", or "GAMMA"
    gamma_value: 2.35  # Only include if type is "GAMMA". The S8's
                       # configured gamma exponent (its default),
                       # confirmed via the Tessera API.
  intensity: "1800 nits"     # Locked intensity/brightness as configured
                             # on the processor (percent or nits)

  # OPERATOR ATTESTATION — read these off the panel OSD, not the software.
  # Nothing here is readable from the Tessera HTTP API, and every one of
  # them moves the measurement. They live on the receiver card and
  # surface only on the panel OSD, so the operator is the only instrument
  # that can report them. A session confirms these values interactively
  # before it measures, and records them in the artifact.
  #
  # Measured on this rig, 2026-08-29: switching selected_calibration took
  # white from 1035 to 1476 cd/m² and moved it from 0.0075 to 0.0040
  # du'v' of D65, while all 302 API leaves stayed identical but for the
  # clock and the chassis temperatures. Studio Mode is the same class of
  # invisibility: it trades peak luminance for low-end bit depth and
  # stores its own PureTone correction.
  #
  # Two artifacts recorded under different panel_state describe different
  # displays and shall not be compared.
  panel_state:
    operating_mode: "Normal Mode"   # as the panel OSD reads it verbatim,
                                    # e.g. "Normal Mode" or "Studio Mode"
    selected_calibration: "Internal Colour Cal (Factory)"

  # Per-feature processor state, declared and audited one feature at a
  # time. A single `processing_disabled` boolean used to stand here; it
  # conflated two categories that behave differently under measurement,
  # and the session cannot translate it into intent, so it is refused.
  #
  # Static per-pixel transfer — the same code produces the same light
  # every frame. This IS the display, and a characterization measures
  # it. Left on deliberately: Dark Magic buys back the effective bit
  # depth the panel loses at low drive, and PureTone corrects the LED
  # and driver non-linearity that otherwise casts the shadows
  # off-neutral as each primary runs out of PWM resolution. Both fix
  # constraints below the layer any OCIO config can reach, and both are
  # on in show — so they are on when we measure.
  processing:
    dark-magic: true
    puretone: true
    extended-bit-depth: true

    # Frame-adaptive: adapts to surrounding frames, so one code stops
    # implying one luminance and the measurement stops meaning
    # anything. Must be off.
    overdrive: false

# PROMOTION POINTER (§spec:provenance)
# The measurement artifact of record: path relative to this file, plus
# the sha256 hex digest of the artifact's bytes. Recording the hash is
# the human act of acceptance — a signature, not an edit.
measurements:
  file: "measurements/ftg_bench_20260829.yaml"
  sha256: "38dbbcef55cd51fa0ebe81df4d1633187f58a53c9c30f03c34b58d2656c62ee9"

# OCIO CONFIGURATION
ocio:
  base_config:
    # ACES 2.0 / OCIO 2.5 studio config. For runtimes older than OCIO 2.5
    # (until version tiers exist), use the ACES 1.3 values:
    #   config_version: "v2.1.0", aces_version: "v1.3", ocio_version: "v2.3"
    type: "studio"              # studio, aces, or custom
    config_version: "v4.0.0"    # config version (e.g., v4.0.0, v2.1.0)
    aces_version: "v2.0"        # ACES version (e.g., v2.0, v1.3)
    ocio_version: "v2.5"        # OCIO version (e.g., v2.5, v2.3)
  # White point policy: how content white (D65) maps to the wall's native white.
  #   "adapted" (default): chromatic adaptation to wall white — full brightness
  #   "absolute": no adaptation — exact chromaticity, costs peak brightness
  #               and may single-channel clip when wall white differs from D65
  white_point_policy: "adapted"
  # VP RADIOMETRIC VIEW (default view; §spec:view-transform)
  vp_radiometric:
    nits_anchor: 300.0        # cd/m² emitted for scene-linear 1.0 — the only
                              # placement knob; recorded in the config
    overflow_policy: "clamp"  # above-peak handling: "clamp" (hard, radiometric
                              # to the ceiling) or "shoulder" (narrow rolloff
                              # confined to the top of the range)
  output_config: "custom_display_config.ocio"  # Auto-generated if not specified
