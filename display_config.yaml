# VALIDATION MODE SETTINGS
# Control how validation failures are handled
# NOTE: Keep this as the first item in the file and set to strict mode by default
validation:
  strict_mode: true        # Enable strict mode (errors instead of warnings)
  # When strict_mode is false, validation failures show warnings but continue
  # When strict_mode is true, validation failures stop the process

# Display Characterization Configuration
# Edit this file with your measured display data, then run the characterization script

display:
  description: "FTG Stage 1"

  led_panel:
    manufacturer: "ROE"              # LED panel manufacturer
    model: "Black Pearl 2 (NS)"      # LED panel model
    version: "2018"                  # Year, batch, or explicit version number
    last_calibrated: "2024-01-15"    # Last calibration date (ISO format: YYYY-MM-DD)
    
    # MEASURED COLORIMETRY (replace with your actual measurements)
    # These should be measured using a colorimeter or spectrophotometer
    # Format: [x, y] coordinates in CIE xy chromaticity space
    colorimetry:
      primaries:
        red: [0.680, 0.320]    # Measured red primary
        green: [0.265, 0.690]  # Measured green primary
        blue: [0.150, 0.060]   # Measured blue primary
      white_point: [0.3127, 0.3290]  # Measured white point

    # MEASURED LUMINANCE CHARACTERISTICS (replace with your actual measurements)
    luminance:
      black_level: 0.005     # cd/m² - measured black level
      peak_luminance: 1000.0 # cd/m² - measured peak luminance
      # Note: contrast_ratio will be calculated automatically
  
  led_processor:
    manufacturer: "Brompton"         # LED processor manufacturer
    model: "S8"                      # LED processor model
    version: "3.5.2"                 # Firmware or software version
    configuration:
      # DISPLAY EOTF SPECIFICATION (Electro-Optical Transfer Function)
      # This is what the display system does: electrical signal → light output
      # We will generate the matching inverse OETF for our color pipeline
      eotf:
        type: "GAMMA"     # Display EOTF type: "PQ", "HLG", or "GAMMA" 
        gamma_value: 2.4   # Only include if type is "GAMMA"
      color_temperature: 6500    # Kelvin
      uniformity_correction: true  # Whether uniformity correction is applied
      # PROCESSOR SIGNAL CONTRACT STATE
      # The generated config is only valid while the processor holds this
      # state; it is recorded in the config metadata for restore and audit.
      intensity: "100%"          # Locked intensity/brightness as configured
                                 # on the processor (percent or nits)
      processing_disabled: true  # Color processing and dynamic features
                                 # (dynamic calibration, dynamic contrast,
                                 # overdrive, etc.) are disabled



# MEASUREMENT METROLOGY (measurement methodology and equipment)
metrology:
  measurement_date: "2024-01-15"         # When measurements were taken
  measurement_device: "X-Rite i1 Pro 2"  # Device used for measurement
  measurement_distance: 1.0              # meters - distance from display

# VIEWING CONDITIONS (measurement environment conditions)
viewing_conditions:
  ambient_light: 5.0     # cd/m² - ambient light during measurement
  viewing_angle: 0.0     # degrees - measurement angle
  surround: "dark"       # "dark", "dim", "average" - viewing environment

# OCIO CONFIGURATION
ocio:
  base_config:
    # ACES 2.0 / OCIO 2.5 studio config. For runtimes older than OCIO 2.5
    # (until version tiers exist), use the ACES 1.3 values:
    #   config_version: "v2.1.0", aces_version: "v1.3", ocio_version: "v2.3"
    type: "studio"              # studio, aces, or custom
    config_version: "v4.0.0"    # config version (e.g., v4.0.0, v2.1.0)
    aces_version: "v2.0"        # ACES version (e.g., v2.0, v1.3)
    ocio_version: "v2.5"        # OCIO version (e.g., v2.5, v2.3)
  # White point policy: how content white (D65) maps to the wall's native white.
  #   "adapted" (default): chromatic adaptation to wall white — full brightness
  #   "absolute": no adaptation — exact chromaticity, costs peak brightness
  #               and may single-channel clip when wall white differs from D65
  white_point_policy: "adapted"
  # VP RADIOMETRIC VIEW (default view; §spec:view-transform)
  vp_radiometric:
    nits_anchor: 300.0        # cd/m² emitted for scene-linear 1.0 — the only
                              # placement knob; recorded in the config
    overflow_policy: "clamp"  # above-peak handling: "clamp" (hard, radiometric
                              # to the ceiling) or "shoulder" (narrow rolloff
                              # confined to the top of the range)
  output_config: "custom_display_config.ocio"  # Will be auto-generated if not specified

